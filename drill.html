<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS PAS + FSA | Scenario Roller</title>
    <meta name="theme-color" content="#545e28">
    <link rel="apple-touch-icon" href="icon-512.png">
    
    <style>
        :root {
            --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
            --slate-400: #94a3b8; --slate-500: #64748b; --slate-600: #475569; --slate-700: #334155;
            --slate-800: #1e293b; --slate-900: #0f172a;
            --blue-50: #eff6ff; --blue-200: #bfdbfe; --blue-800: #1e40af;
            --red-50: #fef2f2; --red-100: #fee2e2; --red-200: #fecaca; --red-600: #dc2626; --red-700: #b91c1c; --red-800: #991b1b;
            --green-50: #f0fdf4; --green-100: #dcfce7; --green-200: #bbf7d0; --green-700: #15803d; --green-900: #14532d;
            --amber-50: #fffbeb; --amber-200: #fde68a; --amber-500: #f59e0b; --amber-900: #78350f;
            
            --brand-green: #545e28;
            --brand-green-hover: #464f21;
            --brand-green-dark: #3a421a;
            --brand-green-light: #e9ebd8; 
            --brand-yellow: #e6b320;
            --brand-yellow-hover: #cfa11c;
            --brand-yellow-light: #fdf2cd;
        }

        *, *::before, *::after { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--slate-100); 
            color: var(--slate-900); 
            padding-bottom: 3rem;
            -webkit-font-smoothing: antialiased; 
        }
        h1, h2, h3, p, ul { margin: 0; padding: 0; }
        button, select { font-family: inherit; }

        .app-header { 
            background: var(--brand-green); 
            color: white; 
            padding: 0.875rem 1rem; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        }
        .header-title { display: flex; align-items: center; gap: 0.75rem; }
        .header-title h1 { font-size: clamp(1rem, 4.5vw, 1.4rem); font-weight: 800; font-style: italic; letter-spacing: -0.025em; }
        .badge-trainer { background: var(--brand-yellow); color: black; font-size: 0.75rem; font-weight: 900; padding: 0.25rem 0.5rem; border-radius: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .app-main { max-width: 42rem; margin: 0 auto; padding: 1rem; }

        /* Controls Bar */
        .controls-card {
            background: white;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 2px solid var(--brand-green);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 1.25rem;
        }
        .filter-label { display: block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: var(--slate-600); margin-bottom: 0.375rem; letter-spacing: 0.05em; }
        .filter-select {
            width: 100%;
            padding: 0.625rem;
            border-radius: 0.375rem;
            border: 1px solid var(--slate-300);
            background: var(--slate-50);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 0.75rem;
        }
        .btn-roll {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-size: 1.125rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            background: var(--brand-green);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.15);
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn-roll:hover { background: var(--brand-green-hover); }
        .btn-roll:active { transform: scale(0.98); }

        /* Scenario Cards */
        .space-y-4 > * + * { margin-top: 1rem; }
        .card { background: white; padding: 1rem; border-radius: 0.625rem; border: 1px solid var(--slate-200); box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--brand-green); padding-bottom: 0.5rem; margin-bottom: 0.75rem; }
        .card-header h2 { font-size: 1.05rem; font-weight: 900; text-transform: uppercase; color: var(--slate-800); display: flex; align-items: center; gap: 0.4rem; }
        .step-tag { font-size: 0.75rem; font-weight: 800; color: var(--slate-500); text-transform: uppercase; }

        .roleplay-prompt {
            background: var(--brand-green-light);
            border-left: 4px solid var(--brand-green);
            padding: 0.625rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--slate-800);
            margin-bottom: 0.75rem;
        }

        .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.625rem; }
        .data-box { background: var(--slate-50); padding: 0.5rem 0.625rem; border-radius: 0.375rem; border: 1px solid var(--slate-200); }
        .data-box.full { grid-column: span 2; }
        .data-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--slate-500); margin-bottom: 0.125rem; }
        .data-val { font-size: 0.95rem; font-weight: 700; color: var(--slate-900); line-height: 1.35; }

        .badge { font-size: 0.75rem; font-weight: 900; padding: 0.2rem 0.45rem; border-radius: 0.25rem; text-transform: uppercase; display: inline-block; }
        .badge-ok { background: var(--green-100); color: var(--green-700); }
        .badge-bad { background: var(--red-100); color: var(--red-700); }
        .badge-warn { background: var(--amber-200); color: var(--amber-900); }

        .vitals-block { background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.625rem; }
        .vitals-block:last-child { margin-bottom: 0; }
        .vitals-title { font-family: monospace; font-size: 0.875rem; font-weight: 800; color: var(--brand-green); margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        .vitals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem; font-size: 0.875rem; font-weight: 600; color: var(--slate-700); }
        .vitals-grid strong { color: var(--slate-900); }

        /* Assessor Answer Key */
        .answer-key {
            background: var(--slate-800);
            color: white;
            border-radius: 0.75rem;
            padding: 1.25rem;
            border-left: 8px solid var(--brand-yellow);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .answer-key h2 { color: var(--brand-yellow); font-size: 1.15rem; font-weight: 900; text-transform: uppercase; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        .key-item { background: rgba(255,255,255,0.08); padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 0.625rem; font-size: 0.9rem; line-height: 1.4; }
        .key-item:last-child { margin-bottom: 0; }
        .key-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--brand-yellow); margin-bottom: 0.25rem; }

        .fsa-pill { display: inline-block; padding: 0.25rem 0.625rem; border-radius: 0.375rem; font-weight: 900; font-size: 0.875rem; margin-top: 0.25rem; }
        .fsa-green { background: var(--green-100); color: var(--green-900); }
        .fsa-red { background: var(--red-100); color: var(--red-800); }
        .fsa-blue { background: var(--blue-50); color: var(--blue-800); }

        .footer-note { text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--slate-400); margin-top: 2rem; letter-spacing: 0.05em; }
    </style>
</head>

    <div class="app-header">

            <img src="icon-512.png" alt="OBS" onerror="this.style.display='none'" style="width: 2.25rem; height: 2.25rem; object-fit: contain; border-radius: 4px;">
            <h1>Scenario Roller</h1>

            pick(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            },

            randInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            },

            roll() {
                this.rollCount++;
                const mode = document.getElementById('mode-select').value;

                // 1. Filter archetypes by chosen training mode
                let pool = this.archetypes;
                if (mode === 'pos_moi') pool = this.archetypes.filter(a => a.posMoi);
                else if (mode === 'clear_spine') pool = this.archetypes.filter(a => a.category === 'clear_spine');
                else if (mode === 'treat_spinal') pool = this.archetypes.filter(a => a.category === 'treat_spinal');
                else if (mode === 'critical_abc') pool = this.archetypes.filter(a => a.category === 'critical_abc');

                const arch = this.pick(pool);

                // 2. Pick a terrain-compatible location
                const matchingLocations = this.locations.filter(l => arch.terrains.includes(l.type));
                const loc = this.pick(matchingLocations.length ? matchingLocations : this.locations);

                // 3. Pick random casualty & SAMPLE history
                const cas = this.pick(this.casualties);
                const sample = this.pick(this.samplePool);
                const moi = this.pick(arch.moiList);

                // 4. Generate dynamic realistic vitals
                const hr1 = this.randInt(arch.vitals1.hrRange[0], arch.vitals1.hrRange[1]);
                const rr1 = this.randInt(arch.vitals1.rrRange[0], arch.vitals1.rrRange[1]);
                const hr2 = this.randInt(arch.vitals2.hrRange[0], arch.vitals2.hrRange[1]);
                const rr2 = this.randInt(arch.vitals2.rrRange[0], arch.vitals2.rrRange[1]);

                this.render({ cas, loc, sample, moi, arch, hr1, rr1, hr2, rr2 });
            },

                    <div class="data-box full">
                        <div class="data-label">${part}</div>
                        <div class="data-val">${desc}</div>
                    </div>
                `).join('');

                        <div class="card-header">

                            </div>

                            </div>

                                <div class="data-val">"${arch.cc}"</div>
                            </div>
                        </div>

                        </div>

                                <div class="data-label">A - Airway</div>
                                <div class="data-val">${arch.primary.a}</div>
                            </div>
                            <div class="data-box">
                                <div class="data-label">B - Breathing</div>
                                <div class="data-val" style="${arch.primary.b.includes('CRITICAL') ? 'color: var(--red-600);' : ''}">${arch.primary.b}</div>
                            </div>
                            <div class="data-box">
                                <div class="data-label">C - Major Bleed / Pulse</div>
                                <div class="data-val" style="${arch.primary.c_bleed.includes('CRITICAL') ? 'color: var(--red-600);' : ''}">${arch.primary.c_bleed} / ${arch.primary.c_pulse}</div>

                        <div class="key-item">
                            <div class="key-label">1. Expected FSA Wizard Outcome</div>
